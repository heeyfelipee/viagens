spring.application.name=viagens
# Server Configuration
server.port=8080
server.servlet.context-path=/

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Database (Development)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:viagensdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Logging Configuration
logging.level.root=INFO
logging.level.com.empresa.viagens=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration (custom properties - see JwtTokenProvider.java)
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurposesOnly12345678901234567890
jwt.expiration=86400000

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.use-root-path=false

# Application Info (custom properties)
app.name=Viagens
app.description=Sistema de Gestão de Viagens com JWT, RBAC e ML/AI
app.version=1.0.0-SNAPSHOT